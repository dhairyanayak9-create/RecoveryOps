<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RecoveryOps — Super Admin</title><style>body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;color:#17233b}.wrap{max-width:1180px;margin:32px auto;padding:0 20px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.card{background:#fff;border:1px solid #dfe6ef;border-radius:14px;padding:22px;margin-bottom:20px;box-shadow:0 4px 18px rgba(23,35,59,.06)}h1{margin:0;font-size:28px}h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{font-size:13px;font-weight:700}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:8px;margin-top:6px}button{border:0;border-radius:8px;padding:9px 13px;cursor:pointer;background:#17233b;color:#fff;font-weight:700}.danger{background:#b42318}.muted{color:#667085;font-size:13px}.msg{margin-top:12px;font-weight:700}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:11px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px}th{background:#f8fafc}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8f5e9}.err{color:#b42318}.ok{color:#087443}.actions{display:flex;gap:7px;flex-wrap:wrap}.editbox{display:none;margin-top:16px;padding:16px;border:1px solid #dfe6ef;border-radius:10px;background:#f8fafc}.editbox .grid{grid-template-columns:repeat(2,minmax(0,1fr))}@media(max-width:700px){.grid{grid-template-columns:1fr}.editbox .grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="head"><div><h1>RecoveryOps Super Admin</h1><div class="muted">Agency onboarding & central tracking</div></div><button onclick="location.href='/'">Back to RecoveryOps</button></div><div id="auth" class="card"><h2>Super Admin session required</h2><p class="muted">Login to RecoveryOps as SUPER_ADMIN in this browser, then open this page again.</p></div><div id="app" style="display:none"><div class="card"><h2>Create New Agency + Admin</h2><form id="form"><div class="grid"><label>Agency Name *<input name="agency_name" required></label><label>Agency Code / Slug *<input name="slug" placeholder="ABC_RECOVERY" required></label><label>Agency Phone<input name="phone"></label><label>Agency Email<input name="email" type="email"></label><label>Address<input name="address"></label><label>Admin Name *<input name="admin_name" required></label><label>Admin Email<input name="admin_email" type="email"></label><label>Admin Phone<input name="admin_phone"></label><label>Admin Password *<input name="password" type="password" minlength="8" required></label></div><br><button type="submit">Create Agency & Admin</button><div id="msg" class="msg"></div></form></div><div class="card"><h2>All Agencies</h2><div id="count" class="muted"></div><br><div class="table"><table><thead><tr><th>Agency</th><th>Code</th><th>Admin(s)</th><th>Staff</th><th>Repo Agents</th><th>Contact</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div><div id="editbox" class="editbox"><h3>Edit Agency</h3><form id="editform"><input type="hidden" name="id"><div class="grid"><label>Name *<input name="name" required></label><label>Slug *<input name="slug" required></label><label>Phone<input name="phone"></label><label>Email<input name="email" type="email"></label><label>Address<input name="address"></label><label>Status<select name="is_active" style="width:100%;padding:11px;margin-top:6px"><option value="true">Active</option><option value="false">Inactive</option></select></label></div><br><button type="submit">Save Changes</button> <button type="button" onclick="closeEdit()">Cancel</button><div id="editmsg" class="msg"></div></form></div></div></div></div><script>const token=localStorage.getItem('recovery_token');const me=JSON.parse(localStorage.getItem('recovery_user')||'null');const auth=document.getElementById('auth'),app=document.getElementById('app'),rows=document.getElementById('rows'),msg=document.getElementById('msg');let agencies=[];if(token&&me&&me.role==='SUPER_ADMIN'){auth.style.display='none';app.style.display='block';load();}async function api(url,opt={}){opt.headers=Object.assign({'Authorization':'Bearer '+token,'Content-Type':'application/json'},opt.headers||{});let r=await fetch(url,opt);let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){try{agencies=await api('/api/super-admin/agencies');document.getElementById('count').textContent=agencies.length+' agencies';rows.innerHTML=agencies.map(a=>`<tr><td><b>${esc(a.name)}</b><br><span class="muted">${esc(a.email||'')}</span></td><td>${esc(a.slug)}</td><td>${a.admin_count||0}</td><td>${a.staff_count||0}</td><td>${a.repo_agent_count||0}</td><td>${esc(a.phone||'')}<br>${esc(a.email||'')}</td><td><span class="pill">${a.is_active?'Active':'Inactive'}</span></td><td><div class="actions"><button onclick="editAgency(${a.id})">Edit</button><button class="danger" onclick="deleteAgency(${a.id},'${esc(a.name)}')">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="8">No agencies found.</td></tr>'}catch(e){rows.innerHTML=`<tr><td colspan="8" class="err">${esc(e.message)}</td></tr>`}}document.getElementById('form').onsubmit=async e=>{e.preventDefault();msg.textContent='Creating...';let o=Object.fromEntries(new FormData(e.target).entries());try{let d=await api('/api/super-admin/agencies',{method:'POST',body:JSON.stringify(o)});msg.textContent=`Created. Admin username: ${d.admin.username}`;msg.className='msg ok';e.target.reset();await load()}catch(err){msg.textContent=err.message;msg.className='msg err'}};function editAgency(id){let a=agencies.find(x=>Number(x.id)===Number(id));if(!a)return;let f=document.getElementById('editform');f.id.value=a.id;f.name.value=a.name||'';f.slug.value=a.slug||'';f.phone.value=a.phone||'';f.email.value=a.email||'';f.address.value=a.address||'';f.is_active.value=String(!!a.is_active);document.getElementById('editbox').style.display='block';window.scrollTo({top:document.getElementById('editbox').offsetTop-20,behavior:'smooth'})}function closeEdit(){document.getElementById('editbox').style.display='none';document.getElementById('editmsg').textContent=''}document.getElementById('editform').onsubmit=async e=>{e.preventDefault();let f=e.target,o={name:f.name.value,slug:f.slug.value,phone:f.phone.value,email:f.email.value,address:f.address.value,is_active:f.is_active.value==='true'};let m=document.getElementById('editmsg');m.textContent='Saving...';try{await api('/api/super-admin/agencies/'+f.id.value,{method:'PUT',body:JSON.stringify(o)});m.textContent='Agency updated successfully';m.className='msg ok';await load()}catch(err){m.textContent=err.message;m.className='msg err'}};async function deleteAgency(id,name){if(!confirm('Delete/deactivate agency "'+name+'"? Its data will be preserved.'))return;try{await api('/api/super-admin/agencies/'+id,{method:'DELETE'});await load()}catch(e){alert(e.message)}}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}</script></body></html>
