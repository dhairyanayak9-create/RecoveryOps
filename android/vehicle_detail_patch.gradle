def patchVehicleDetail = tasks.register('patchVehicleDetail') {
    doLast {
        File file = file('src/main/java/com/recoveryops/MainActivity.java')
        String source = file.getText('UTF-8')
        if (source.contains('RECOVERYOPS_SCREEN_V2')) {
            return
        }

        String replacement = '''    // RECOVERYOPS_SCREEN_V2
    private void showDetails(JSONObject vehicle) {
        if (vehicle == null) return;

        final ScrollView scroll = new ScrollView(this);
        scroll.setFillViewport(true);
        scroll.setBackgroundColor(Color.rgb(238, 238, 238));

        LinearLayout root = new LinearLayout(this);
        root.setOrientation(LinearLayout.VERTICAL);
        root.setPadding(14, 14, 14, 18);
        root.setBackgroundColor(Color.rgb(238, 238, 238));

        LinearLayout header = new LinearLayout(this);
        header.setOrientation(LinearLayout.HORIZONTAL);
        header.setGravity(Gravity.CENTER_VERTICAL);
        header.setPadding(18, 18, 14, 18);
        GradientDrawable headerBg = new GradientDrawable();
        headerBg.setColor(Color.rgb(198, 24, 48));
        headerBg.setCornerRadius(14);
        header.setBackground(headerBg);

        TextView status = text(safe(vehicle, "status"), 20, Color.WHITE, true);
        header.addView(status, new LinearLayout.LayoutParams(0, 58, 1f));

        Button repoKit = new Button(this);
        repoKit.setText("REPO KIT");
        repoKit.setTextSize(14);
        repoKit.setAllCaps(false);
        repoKit.setTextColor(Color.rgb(35, 35, 35));
        repoKit.setBackgroundTintList(android.content.res.ColorStateList.valueOf(Color.rgb(255, 218, 72)));
        repoKit.setOnClickListener(v -> shareWhatsApp(vehicle));
        header.addView(repoKit, new LinearLayout.LayoutParams(130, 58));
        root.addView(header);

        LinearLayout customer = new LinearLayout(this);
        customer.setOrientation(LinearLayout.VERTICAL);
        customer.setPadding(18, 20, 18, 20);
        customer.setBackgroundColor(Color.WHITE);
        customer.addView(text(safe(vehicle, "customer_name"), 24, Color.rgb(45, 45, 58), true));
        customer.addView(text(safe(vehicle, "city"), 16, Color.rgb(80, 90, 105), false));
        root.addView(customer);

        LinearLayout vehicleBox = detailSection("VEHICLE DETAILS");
        addDetailRow(vehicleBox, "Make", firstValue(vehicle, "make", "vehicle_type"));
        addDetailRow(vehicleBox, "Chassis No", safe(vehicle, "chassis_no"));
        addDetailRow(vehicleBox, "Engine No", safe(vehicle, "engine_no"));
        addDetailRow(vehicleBox, "Allocation", safe(vehicle, "allocation"));
        addDetailRow(vehicleBox, "Model", safe(vehicle, "model"));
        addDetailRow(vehicleBox, "Upload Date", firstValue(vehicle, "upload_date", "updated_at"));
        addDetailRow(vehicleBox, "Product Name", firstValue(vehicle, "product_name", "vehicle_type"));
        root.addView(vehicleBox);

        LinearLayout loanBox = detailSection("LOAN DETAILS");
        addDetailRow(loanBox, "Bank", safe(vehicle, "bank_name"));
        addDetailRow(loanBox, "Branch", safe(vehicle, "branch"));
        addDetailRow(loanBox, "Agreement No", firstValue(vehicle, "agreement_no", "loan_no"));
        addDetailRow(loanBox, "Emi", safe(vehicle, "emi"));
        addDetailRow(loanBox, "POS", safe(vehicle, "pos"));
        addDetailRow(loanBox, "BKTS", safe(vehicle, "bkts"));
        addDetailRow(loanBox, "TBR", safe(vehicle, "tbr"));
        addDetailRow(loanBox, "Seasoning", safe(vehicle, "seasoning"));
        addDetailRow(loanBox, "Sec 17", safe(vehicle, "sec_17"));
        root.addView(loanBox);

        LinearLayout confirmed = detailSection("CONFIRMED BY");
        addConfirmedRow(confirmed, vehicle, "1st");
        addConfirmedRow(confirmed, vehicle, "2nd");
        addConfirmedRow(confirmed, vehicle, "3rd");
        root.addView(confirmed);

        LinearLayout attachments = detailSection("ATTACHMENTS");
        LinearLayout attachmentActions = new LinearLayout(this);
        attachmentActions.setOrientation(LinearLayout.HORIZONTAL);
        attachmentActions.setGravity(Gravity.CENTER);
        Button sms = detailActionButton("SMS", Color.rgb(40, 40, 45));
        Button whatsapp = detailActionButton("WhatsApp", Color.rgb(76, 175, 80));
        sms.setOnClickListener(v -> Toast.makeText(this, "SMS attachment action", Toast.LENGTH_SHORT).show());
        whatsapp.setOnClickListener(v -> shareWhatsApp(vehicle));
        attachmentActions.addView(sms, new LinearLayout.LayoutParams(0, 70, 1f));
        LinearLayout.LayoutParams wp = new LinearLayout.LayoutParams(0, 70, 1f);
        wp.leftMargin = 12;
        attachmentActions.addView(whatsapp, wp);
        attachments.addView(attachmentActions);
        root.addView(attachments);

        scroll.addView(root);

        AlertDialog dialog = new AlertDialog.Builder(this)
                .setTitle(safe(vehicle, "loan_no"))
                .setView(scroll)
                .setNegativeButton("CLOSE", null)
                .create();
        dialog.show();
        Button close = dialog.getButton(AlertDialog.BUTTON_NEGATIVE);
        if (close != null) {
            close.setTextSize(15);
            close.setMinHeight(60);
        }
    }

    private LinearLayout detailSection(String title) {
        LinearLayout section = new LinearLayout(this);
        section.setOrientation(LinearLayout.VERTICAL);
        section.setPadding(18, 18, 18, 18);
        section.setBackgroundColor(Color.WHITE);
        TextView heading = text(title, 18, Color.rgb(45, 45, 58), false);
        heading.setPadding(0, 0, 0, 10);
        section.addView(heading);
        return section;
    }

    private void addDetailRow(LinearLayout box, String label, String value) {
        LinearLayout row = new LinearLayout(this);
        row.setOrientation(LinearLayout.HORIZONTAL);
        row.setPadding(0, 5, 0, 5);
        TextView key = text(label + ":", 15, Color.rgb(65, 78, 92), true);
        TextView val = text(value, 15, Color.rgb(65, 78, 92), false);
        row.addView(key, new LinearLayout.LayoutParams(0, -2, 0.42f));
        row.addView(val, new LinearLayout.LayoutParams(0, -2, 0.58f));
        box.addView(row);
    }

    private void addConfirmedRow(LinearLayout box, JSONObject vehicle, String prefix) {
        String key = prefix.toLowerCase(Locale.ROOT);
        String name = firstValue(vehicle, key + "_name", "confirmed_" + key + "_name");
        String number = firstValue(vehicle, key + "_no", "confirmed_" + key + "_no");
        LinearLayout row = new LinearLayout(this);
        row.setOrientation(LinearLayout.HORIZONTAL);
        row.setGravity(Gravity.CENTER_VERTICAL);
        LinearLayout names = new LinearLayout(this);
        names.setOrientation(LinearLayout.VERTICAL);
        names.addView(text(prefix + " Name: " + name, 15, Color.rgb(65, 78, 92), true));
        names.addView(text("No.: " + number, 15, Color.rgb(65, 78, 92), false));
        row.addView(names, new LinearLayout.LayoutParams(0, -2, 1f));
        Button wa = detailActionButton("WhatsApp", Color.rgb(76, 175, 80));
        wa.setOnClickListener(v -> shareWhatsApp(vehicle));
        row.addView(wa, new LinearLayout.LayoutParams(125, 58));
        box.addView(row);
    }

    private Button detailActionButton(String title, int color) {
        Button b = new Button(this);
        b.setText(title);
        b.setTextSize(13);
        b.setAllCaps(false);
        b.setTextColor(Color.WHITE);
        b.setBackgroundTintList(android.content.res.ColorStateList.valueOf(color));
        return b;
    }

    private String firstValue(JSONObject o, String primary, String fallback) {
        String a = safe(o, primary);
        if (!"N/A".equals(a)) return a;
        return safe(o, fallback);
    }

'''

        String regex = '(?s)    private void showDetails\\(JSONObject vehicle\\) \\{.*?\\n    private String safe\\('
        String patched = source.replaceFirst(regex, java.util.regex.Matcher.quoteReplacement(replacement + '    private String safe('))
        if (patched == source) {
            throw new GradleException('Vehicle detail showDetails block was not found')
        }
        file.write(patched, 'UTF-8')
    }
}

tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn patchVehicleDetail
}
