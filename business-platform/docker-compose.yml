services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: business_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/business_platform
      JWT_SECRET: change-me
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  pgdata:
